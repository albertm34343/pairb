<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KNOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/splash.css">
    <link rel="stylesheet" href="css/no-pair.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/interactive.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/edit-profile.css">
    <link rel="stylesheet" href="css/payment.css">
    <style>
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #1a1a1e;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 90vw;
        }
        
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        
        .confirm-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
        }
        
        .confirm-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .confirm-buttons button {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: #1a1a1e;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .confirm-buttons .danger-button {
            background: rgba(255, 100, 100, 0.35);
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #d63031;
        }
        
        .screen {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <p id="confirm-text" style="margin-bottom:16px; font-size:15px; color:#1a1a1e;"></p>
            <div class="confirm-buttons">
                <button onclick="confirmAction(false)">Отмена</button>
                <button class="danger-button" onclick="confirmAction(true)">Да</button>
            </div>
        </div>
    </div>
    
    <div id="splash-screen" class="screen"></div>
    <div id="no-pair-screen" class="screen" style="display:none;"></div>
    <div id="onboarding-screen" class="screen" style="display:none;"></div>
    <div id="main-screen" class="screen" style="display:none;"></div>
    <div id="interactive-screen" class="screen" style="display:none;"></div>
    <div id="settings-screen" class="screen" style="display:none;"></div>
    <div id="edit-profile-screen" class="screen" style="display:none;"></div>
    <div id="payment-screen" class="screen" style="display:none;"></div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/interactive.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
