<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KNOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/splash.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/interactive.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/payment.css">
    <style>
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
        
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        
        .confirm-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }
        
        .confirm-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .screen {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <p id="confirm-text" style="margin-bottom:16px;"></p>
            <div class="confirm-buttons">
                <button onclick="confirmAction(false)">Отмена</button>
                <button class="danger-button" onclick="confirmAction(true)">Да</button>
            </div>
        </div>
    </div>
    
    <div id="splash-screen" class="screen"></div>
    <div id="no-pair-screen" class="screen" style="display:none;">
        <div style="text-align:center; color:#666; font-size:16px;">Сначала создайте пару через бота</div>
    </div>
    <div id="onboarding-screen" class="screen" style="display:none;"></div>
    <div id="main-screen" class="screen" style="display:none;"></div>
    <div id="interactive-screen" class="screen" style="display:none;"></div>
    <div id="settings-screen" class="screen" style="display:none;"></div>
    <div id="edit-profile-screen" class="screen" style="display:none;"></div>
    <div id="payment-screen" class="screen" style="display:none;"></div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="js/splash.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/interactive.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
