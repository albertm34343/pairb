<div class="onboarding-page">
    <h1 class="onboarding-logo">knot</h1>
    <p class="partner-info" id="onboarding-partner"></p>
    <p class="onboarding-subtitle">Заполните данные о себе</p>
    
    <div class="form-group">
        <label>Имя</label>
        <input type="text" id="name" placeholder="Ваше имя" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    
    <div class="form-group">
        <label>Пол</label>
        <select id="gender">
            <option value="">Выберите...</option>
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>Дата начала отношений</label>
        <input type="date" id="relationship_date">
    </div>
    
    <div class="form-group">
        <label>Город</label>
        <input type="text" id="city" placeholder="Ваш город" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    
    <div class="form-group">
        <label>Личные увлечения</label>
        <textarea id="personal_hobbies" rows="3" placeholder="Например: спорт, музыка, книги" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>
    
    <div class="form-group">
        <label>Совместные увлечения</label>
        <textarea id="shared_hobbies" rows="3" placeholder="Например: путешествия, кино, готовка" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>
    
    <button class="onboarding-submit" onclick="submitOnboarding()">Сохранить</button>
</div>
